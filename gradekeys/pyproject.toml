[project]
name = "gradekeys"
version = "0.1.0"
description = "Turn any song into a learnable, grade-adjustable piano score (sheet-music PDF)."
requires-python = ">=3.10,<3.13"
dependencies = [
    # The deterministic music-theory core: parsing, harmony, arrangement,
    # MusicXML export. Pure-Python and the only hard dependency.
    "music21>=9.1",
]

[project.optional-dependencies]
# Heavy, optional audio pipeline. Only needed when the input is real audio
# (a file, a URL, or a song name) rather than an already-extracted note set.
# Kept out of the core so the theory engine installs and tests anywhere.
audio = [
    "yt-dlp>=2024.12.0",   # resolve a song name / URL to a local audio file
    "librosa>=0.10",       # monophonic melody pitch tracking + onset/energy analysis
    "soundfile>=0.12",     # audio IO
    "numpy>=1.24",
]
# Polyphonic transcription (piano stems). TensorFlow-backed, very large; opt-in.
transcribe = [
    "basic-pitch>=0.3",
]
# Source separation to isolate the piano / vocal stem before transcription.
separate = [
    "demucs>=4.0.1",
]
# Pure-pip PDF engraver: no MuseScore/LilyPond binary required.
pdf = [
    "verovio>=4.0",
    "cairosvg>=2.7",
    "pypdf>=4.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
gradekeys = "gradekeys.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gradekeys"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
